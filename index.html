<!DOCTYPE html>
<html>
<head>
    <title>Digital Healthcare Record System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Digital Healthcare Record System</h1>

        <form id="patientForm">
            <input type="text" id="name" placeholder="Patient Name" required>

            <input type="number" id="age" placeholder="Age" required>

            <input type="text" id="doctor" placeholder="Doctor Name" required>

            <textarea id="diagnosis" placeholder="Diagnosis" required></textarea>

            <button type="submit">Save Record</button>
        </form>

        <h2>Patient Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Doctor</th>
                    <th>Diagnosis</th>
                </tr>
            </thead>
            <tbody id="recordTable"></tbody>
        </table>
    </div>

    <script src="script.js"></script>

</body>
</html>
